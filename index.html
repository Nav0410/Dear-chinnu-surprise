<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffeff5">
  <title>Dear Chinnu ❤️ | Forever Yours, Navi</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(135deg,#ffd4e3,#ffeef5 48%,#f4d9ff); color: #a00053; font-family: Georgia, 'Times New Roman', serif; text-align: center; overflow-x: hidden; }
    .card { position: relative; z-index: 1; width: min(92%, 650px); margin: 38px auto; padding: 36px 22px 44px; border-radius: 26px; background: rgba(255,255,255,.83); box-shadow: 0 12px 42px rgba(170,0,84,.13); }
    .big-heart { font-size: 76px; line-height: 1.2; animation: pulse 1.7s infinite; }
    h1 { color: #e00067; font-size: clamp(34px,8vw,54px); margin: 16px 0 18px; min-height: 1.4em; }
    h2 { font-size: clamp(26px,6vw,40px); font-style: italic; }
    p { font-size: clamp(21px,4.7vw,29px); line-height: 1.65; }
    button { background: #ff0069; color: white; border: 0; border-radius: 40px; padding: 17px 27px; margin: 15px 6px; font-size: 19px; cursor: pointer; box-shadow: 0 6px 16px rgba(255,0,105,.2); }
    button:active { transform: scale(.97); }
    button[hidden] { display: none; }
    #surprise { display: block; animation: reveal 1.2s ease-out both; animation-delay: .7s; }
    .signature { font-size: clamp(27px,6vw,40px); font-style: italic; font-weight: bold; }
    .symbols { font-size: 29px; }
    #musicStatus { min-height: 1.5em; font-size: 16px; color: #9c245b; }
    .floating-heart { position: fixed; bottom: -50px; pointer-events: none; z-index: 0; animation: floatUp linear forwards; opacity: .65; }
    @keyframes floatUp { from { transform: translateY(0) rotate(0); opacity: .7; } to { transform: translateY(-115vh) rotate(28deg); opacity: 0; } }
    @keyframes pulse { 50% { transform: scale(1.12); } }
    @keyframes reveal { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <main class="card">
    <div class="big-heart">❤️</div>
    <h1 id="typedTitle" aria-label="Dear Chinnu ❤️"></h1>
    <section id="surprise">
      <h2>My Love, My World 🌹</h2>
      <p>Every moment with you is a beautiful blessing. 💕</p>
      <h2>My Dearest Chinnu 💖</h2>
      <p>You are my happiness, my strength, and my forever love. ❤️</p>
      <p>No matter how many days pass, I will always choose you, again and again. 🥰</p>
      <p class="signature">Forever Yours, Navi ❤️💕</p>
      <div class="symbols">💍 💕 🌹 ✨</div>
    </section>
    <button id="musicButton" type="button" onclick="toggleMusic()" hidden>🎵 Tap to Enable Music</button>
    <p id="musicStatus" role="status" aria-live="polite"></p>
  </main>

  <audio id="loveMusic" preload="none" playsinline>
    <source src="music/romantic.mp3" type="audio/mpeg">
    Your browser does not support audio playback.
  </audio>

  <script>
    const music = document.getElementById('loveMusic');
    const musicButton = document.getElementById('musicButton');
    const musicStatus = document.getElementById('musicStatus');
    music.volume = 0.7;
    music.loop = true;

    function typeText() {
      const text = 'Dear Chinnu ❤️';
      let i = 0;
      const timer = setInterval(() => {
        document.getElementById('typedTitle').textContent = text.slice(0, ++i);
        if (i >= text.length) clearInterval(timer);
      }, 110);
    }

    function createHeart() {
      const heart = document.createElement('span');
      heart.className = 'floating-heart';
      heart.textContent = ['❤️','💕','💖','💗','🌸'][Math.floor(Math.random()*5)];
      heart.style.left = Math.random()*100 + 'vw';
      heart.style.fontSize = (18 + Math.random()*22) + 'px';
      heart.style.animationDuration = (5 + Math.random()*5) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 10500);
    }

    function showMusicButton(label) {
      musicButton.hidden = false;
      musicButton.textContent = label;
    }

    function tryAutoPlay() {
      // Browsers usually block audible autoplay until a user gesture.
      const attempt = music.play();
      if (attempt && typeof attempt.then === 'function') {
        attempt.then(() => {
          showMusicButton('⏸ Pause Music');
          musicStatus.textContent = '';
        }).catch(() => {
          showMusicButton('🎵 Tap to Enable Music');
          musicStatus.textContent = 'Tap once to hear Inthandham ❤️';
        });
      }
    }

    function toggleMusic() {
      if (!music.paused) {
        music.pause();
        showMusicButton('▶ Play Music');
        musicStatus.textContent = '';
        return;
      }
      // play() is called synchronously inside the tap handler.
      const attempt = music.play();
      if (attempt && typeof attempt.then === 'function') {
        attempt.then(() => {
          showMusicButton('⏸ Pause Music');
          musicStatus.textContent = '';
        }).catch(error => {
          showMusicButton('🎵 Tap to Enable Music');
          musicStatus.textContent = 'Unable to play audio: ' + (error.message || error.name);
        });
      }
    }

    music.addEventListener('ended', () => { showMusicButton('▶ Play Music'); });
    music.addEventListener('error', () => {
      const code = music.error ? music.error.code : 'unknown';
      showMusicButton('🎵 Tap to Enable Music');
      musicStatus.textContent = 'Audio loading error (code ' + code + '). Check music/romantic.mp3.';
    });
    typeText();
    for (let i = 0; i < 16; i++) setTimeout(createHeart, i * 140);
    setInterval(createHeart, 700);
    tryAutoPlay();
  </script>
</body>
</html>
